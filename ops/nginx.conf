# Template per installazioni senza Coolify. Sostituire dominio e certificati.
limit_req_zone $binary_remote_addr zone=elettra_login:10m rate=5r/m;

server {
    listen 80;
    server_name crm.example.it;
    return 301 https://crm.example.it$request_uri;
}
server {
    listen 443 ssl;
    server_name crm.example.it;
    ssl_certificate /etc/letsencrypt/live/crm.example.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    client_body_timeout 30s;
    limit_req_status 429;

    location = /login {
        limit_req zone=elettra_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
